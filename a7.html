<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#092832">
    <title>PRISM BREAK｜立體打磚塊</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #092832;
            --deep: #061820;
            --paper: #e9ffef;
            --muted: #94b7b3;
            --lime: #d9ff49;
            --pink: #ff5798;
            --cyan: #45f4e5;
            --orange: #ff9459;
        }
        * { box-sizing: border-box; }
        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px 24px;
            color: var(--paper);
            background-color: var(--ink);
            background-image: radial-gradient(ellipse at 14% 10%, rgba(37, 157, 138, .2), transparent 34%),
                radial-gradient(ellipse at 92% 84%, rgba(255, 87, 152, .15), transparent 30%),
                linear-gradient(rgba(143, 231, 206, .045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(143, 231, 206, .045) 1px, transparent 1px);
            background-size: auto, auto, 36px 36px, 36px 36px;
            font-family: "Trebuchet MS", "Microsoft JhengHei", sans-serif;
        }
        button { font: inherit; }
        .arcade { width: min(100%, 1040px); margin: 0 auto; }
        .masthead {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin: 0 2px 20px;
        }
        .eyebrow { margin: 0 0 5px; color: var(--pink); font: 700 11px/1.2 monospace; letter-spacing: 2px; }
        h1 { margin: 0; color: var(--lime); font: 900 clamp(27px, 5vw, 48px)/.95 Georgia, "Microsoft JhengHei", serif; }
        .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
        .edition { flex: none; padding: 8px 10px; border: 1px solid #40665e; color: var(--cyan); font: 700 10px monospace; letter-spacing: 1px; }
        .cabinet {
            padding: clamp(12px, 2.4vw, 24px);
            border: 1px solid #46766d;
            background: linear-gradient(145deg, rgba(23, 64, 67, .96), rgba(9, 34, 43, .98) 62%);
            box-shadow: 0 22px 65px #020d11a8, inset 0 1px #b1ffe51a;
        }
        .topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
        .led { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font: 700 10px monospace; letter-spacing: 1.5px; }
        .led::before { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px var(--lime); content: ""; }
        .stats { display: flex; gap: clamp(16px, 5vw, 54px); margin: 0; }
        .stat { display: grid; gap: 4px; min-width: 48px; }
        .stat dt { color: var(--muted); font: 700 9px monospace; letter-spacing: 1.1px; }
        .stat dd { margin: 0; color: white; font: 800 19px/1 monospace; font-variant-numeric: tabular-nums; }
        .stat dd.accent { color: var(--lime); }
        .screen-wrap { position: relative; overflow: hidden; border: 1px solid #578c80; background: var(--deep); box-shadow: inset 0 0 32px #0009, 0 6px 0 #041317; }
        canvas { display: block; width: 100%; height: auto; aspect-ratio: 960 / 540; touch-action: none; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 18px;
        }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .button {
            min-height: 40px;
            padding: 0 15px;
            border: 1px solid #537d71;
            border-radius: 3px;
            background: #102f37;
            color: var(--paper);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background .16s ease, color .16s ease, transform .16s ease;
        }
        .button:hover { background: #1b4548; transform: translateY(-1px); }
        .button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
        .button.primary { border-color: var(--lime); background: var(--lime); color: #15231c; }
        .button.primary:hover { background: #e6ff88; }
        .hints { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font: 11px/1.4 monospace; }
        kbd { padding: 2px 5px; border: 1px solid #466b63; border-bottom-width: 2px; color: #e2fff1; font: inherit; }
        .footnote { margin: 15px 2px 0; color: #7fa59e; font: 10px/1.5 monospace; }
        @media (max-width: 560px) {
            body { padding: 20px 12px; }
            .masthead { align-items: start; }
            .edition { margin-top: 4px; font-size: 9px; }
            .topline { align-items: start; flex-direction: column; }
            .stat dd { font-size: 17px; }
            .stat dt { font-size: 8px; }
            .controls { align-items: stretch; }
            .actions { display: grid; grid-template-columns: 1fr 1fr; }
            .button { padding-inline: 8px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <main class="arcade">
        <header class="masthead">
            <div>
                <p class="eyebrow">ARCADE 07 / LIGHT REFRACTION</p>
                <h1>PRISM BREAK</h1>
                <p class="subtitle">打碎色彩，讓光線自由。</p>
            </div>
            <div class="edition">3D COLOR EDITION</div>
        </header>
        <section class="cabinet" aria-label="立體打磚塊遊戲">
            <div class="topline">
                <span class="led" id="status" aria-live="polite">READY TO PLAY</span>
                <dl class="stats">
                    <div class="stat"><dt>分數 / SCORE</dt><dd class="accent" id="score">0000</dd></div>
                    <div class="stat"><dt>生命 / LIVES</dt><dd id="lives">03</dd></div>
                    <div class="stat"><dt>關卡 / STAGE</dt><dd id="level">01</dd></div>
                    <div class="stat"><dt>最高 / BEST</dt><dd id="best">0000</dd></div>
                </dl>
            </div>
            <div class="screen-wrap">
                <canvas id="game" width="960" height="540" aria-label="打磚塊遊戲畫面。使用左右方向鍵或拖曳擋板接球。"></canvas>
            </div>
            <div class="controls">
                <div class="actions">
                    <button class="button primary" id="start" type="button">開始遊戲</button>
                    <button class="button" id="pause" type="button" aria-label="暫停遊戲">暫停</button>
                    <button class="button" id="sound" type="button" aria-pressed="true">音效：開</button>
                </div>
                <div class="hints" aria-label="操作方式">
                    <span><kbd>←</kbd> <kbd>→</kbd> 移動</span>
                    <span><kbd>空白鍵</kbd> 發球 / 暫停</span>
                    <span>觸控或滑鼠拖曳</span>
                </div>
            </div>
        </section>
        <p class="footnote">PRISM LAB · KEEP THE BALL IN PLAY · HIGH SCORE SAVED ON THIS DEVICE</p>
    </main>
    <script>
    (() => {
        const canvas = document.querySelector('#game');
        const ctx = canvas.getContext('2d');
        const ui = {
            score: document.querySelector('#score'), lives: document.querySelector('#lives'),
            level: document.querySelector('#level'), best: document.querySelector('#best'),
            status: document.querySelector('#status'), start: document.querySelector('#start'),
            pause: document.querySelector('#pause'), sound: document.querySelector('#sound')
        };
        const W = 960, H = 540, left = 66, right = 894, top = 54, bottom = 505;
        const colors = ['#ff5798', '#ff9459', '#ffd94a', '#a6f64b', '#45f4e5', '#70a9ff'];
        const keys = new Set();
        let bricks = [], particles = [], score = 0, lives = 3, level = 1, best = 0;
        let state = 'ready', soundOn = true, audio = null, lastTime = 0, raf = 0;
        let paddle = { x: W / 2, y: 466, w: 126, h: 18, target: W / 2 };
        let ball = { x: W / 2, y: 442, vx: 210, vy: -310, r: 10, trail: [] };
        const stars = Array.from({ length: 75 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .5 + Math.random() * 1.5, a: .15 + Math.random() * .48 }));
        try { best = Number(localStorage.getItem('prismBreakBest')) || 0; } catch (_) {}

        function sound(frequency, duration = .1, type = 'sine', volume = .045) {
            if (!soundOn) return;
            try {
                audio ||= new (window.AudioContext || window.webkitAudioContext)();
                if (audio.state === 'suspended') audio.resume();
                const oscillator = audio.createOscillator();
                const gain = audio.createGain();
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, audio.currentTime);
                gain.gain.setValueAtTime(volume, audio.currentTime);
                gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
                oscillator.connect(gain);
                gain.connect(audio.destination);
                oscillator.start();
                oscillator.stop(audio.currentTime + duration);
            } catch (_) {}
        }

        function makeBricks() {
            bricks = [];
            const columns = 10, rows = 6, gap = 8, width = 72, height = 23;
            const startX = (W - (columns * width + (columns - 1) * gap)) / 2;
            for (let row = 0; row < rows; row++) {
                for (let column = 0; column < columns; column++) {
                    bricks.push({ x: startX + column * (width + gap), y: 112 + row * 35, w: width, h: height, color: colors[(row + Math.floor(column / 2)) % colors.length], hp: row < 2 && level > 1 ? 2 : 1 });
                }
            }
        }

        function resetBall() {
            paddle.x = W / 2;
            paddle.target = W / 2;
            ball = { x: paddle.x, y: paddle.y - 24, vx: 210 + level * 12, vy: -(300 + level * 16), r: 10, trail: [] };
        }

        function updateUI() {
            ui.score.textContent = String(score).padStart(4, '0');
            ui.lives.textContent = String(lives).padStart(2, '0');
            ui.level.textContent = String(level).padStart(2, '0');
            ui.best.textContent = String(best).padStart(4, '0');
            ui.status.textContent = state === 'playing' ? 'IN PLAY' : state === 'paused' ? 'PAUSED' : state === 'over' ? 'GAME OVER' : state === 'clear' ? 'STAGE CLEAR' : 'READY TO PLAY';
            ui.start.textContent = state === 'ready' ? '開始遊戲' : state === 'over' ? '再玩一次' : state === 'clear' ? '下一關' : '重新開始';
            ui.pause.textContent = state === 'paused' ? '繼續' : '暫停';
        }

        function begin() {
            if (state === 'over') { score = 0; lives = 3; level = 1; makeBricks(); }
            else if (state === 'clear') { level++; makeBricks(); }
            else if (state === 'ready') makeBricks();
            state = 'playing';
            lastTime = performance.now();
            sound(520, .12, 'triangle', .035);
            updateUI();
        }

        function burst(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 50 + Math.random() * 210;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: .35 + Math.random() * .48, age: 0, color, size: 2 + Math.random() * 4 });
            }
        }

        function roundedRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, radius);
        }

        function drawBrick(brick) {
            const depth = 5;
            ctx.save();
            ctx.shadowColor = brick.color;
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#050e16';
            roundedRect(brick.x + depth, brick.y + depth, brick.w, brick.h, 5);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = brick.color;
            roundedRect(brick.x, brick.y, brick.w, brick.h, 5);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,.43)';
            roundedRect(brick.x + 3, brick.y + 2, brick.w - 6, 4, 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(8,22,30,.23)';
            ctx.beginPath();
            ctx.moveTo(brick.x + brick.w - 9, brick.y + 7);
            ctx.lineTo(brick.x + brick.w - 3, brick.y + 7);
            ctx.lineTo(brick.x + brick.w - 3, brick.y + brick.h - 5);
            ctx.lineTo(brick.x + brick.w - 10, brick.y + brick.h - 2);
            ctx.closePath();
            ctx.fill();
            if (brick.hp > 1) {
                ctx.fillStyle = '#fff6cc';
                ctx.beginPath(); ctx.arc(brick.x + brick.w / 2, brick.y + brick.h / 2 + 1, 3, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function drawPaddle() {
            const x = paddle.x - paddle.w / 2;
            ctx.save();
            ctx.shadowColor = '#45f4e5'; ctx.shadowBlur = 22;
            ctx.fillStyle = '#0e8c91';
            roundedRect(x + 4, paddle.y + 6, paddle.w, paddle.h, 9); ctx.fill();
            const gradient = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
            gradient.addColorStop(0, '#efffbd'); gradient.addColorStop(.24, '#45f4e5'); gradient.addColorStop(1, '#0a9d9f');
            ctx.fillStyle = gradient;
            roundedRect(x, paddle.y, paddle.w, paddle.h, 9); ctx.fill();
            ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.82)';
            roundedRect(x + 12, paddle.y + 3, paddle.w - 24, 3, 2); ctx.fill();
            ctx.restore();
        }

        function drawBall() {
            ball.trail.forEach((point, index) => {
                ctx.globalAlpha = (index / ball.trail.length) * .2;
                ctx.fillStyle = '#fff58a';
                ctx.beginPath(); ctx.arc(point.x, point.y, ball.r * index / ball.trail.length, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;
            ctx.save(); ctx.shadowColor = '#fff4a6'; ctx.shadowBlur = 22;
            const gradient = ctx.createRadialGradient(ball.x - 3, ball.y - 4, 1, ball.x, ball.y, ball.r + 2);
            gradient.addColorStop(0, '#ffffff'); gradient.addColorStop(.38, '#fff9b0'); gradient.addColorStop(1, '#ff9459');
            ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawOverlay(title, detail, accent = '#d9ff49') {
            ctx.fillStyle = 'rgba(4, 15, 22, .78)'; ctx.fillRect(left + 1, top + 1, right - left - 2, bottom - top - 2);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = accent; ctx.font = '900 38px Georgia, serif'; ctx.fillText(title, W / 2, 245);
            ctx.fillStyle = '#e4fff4'; ctx.font = '16px "Microsoft JhengHei", sans-serif'; ctx.fillText(detail, W / 2, 285);
            ctx.fillStyle = '#8cbbb1'; ctx.font = '12px monospace'; ctx.fillText('PRESS START OR SPACE', W / 2, 325);
        }

        function draw() {
            const background = ctx.createLinearGradient(0, top, 0, bottom);
            background.addColorStop(0, '#102a3c'); background.addColorStop(.55, '#0a2030'); background.addColorStop(1, '#091b27');
            ctx.fillStyle = '#07151e'; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = background; ctx.fillRect(left, top, right - left, bottom - top);
            stars.forEach(star => {
                ctx.globalAlpha = star.a; ctx.fillStyle = '#b8fff0';
                ctx.fillRect(left + star.x % (right - left), top + star.y % (bottom - top), star.r, star.r);
            });
            ctx.globalAlpha = 1;
            ctx.save(); ctx.beginPath(); ctx.rect(left, top, right - left, bottom - top); ctx.clip();
            ctx.strokeStyle = 'rgba(78, 215, 194, .075)'; ctx.lineWidth = 1;
            for (let i = 0; i <= 12; i++) {
                const x = left + i * (right - left) / 12;
                ctx.beginPath(); ctx.moveTo(W / 2, top + 110); ctx.lineTo(x, bottom); ctx.stroke();
            }
            for (let i = 0; i < 7; i++) {
                const y = 245 + i * i * 5;
                ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
            }
            bricks.forEach(drawBrick);
            particles.forEach(particle => {
                ctx.globalAlpha = Math.max(0, 1 - particle.age / particle.life);
                ctx.fillStyle = particle.color;
                ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
            });
            ctx.globalAlpha = 1;
            drawPaddle(); drawBall();
            ctx.restore();
            ctx.strokeStyle = '#58edcf'; ctx.lineWidth = 2; ctx.shadowColor = '#45f4e5'; ctx.shadowBlur = 13;
            ctx.strokeRect(left, top, right - left, bottom - top); ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff5798'; ctx.fillRect(left, top, 75, 3); ctx.fillRect(right - 75, bottom - 3, 75, 3);
            if (state === 'ready') drawOverlay('PRISM BREAK', '準備好，讓色彩彈起來了嗎？');
            if (state === 'paused') drawOverlay('PAUSED', '按空白鍵或「繼續」回到遊戲', '#45f4e5');
            if (state === 'over') drawOverlay('GAME OVER', `最終得分  ${String(score).padStart(4, '0')}`, '#ff5798');
            if (state === 'clear') drawOverlay('STAGE CLEAR!', '漂亮！準備迎接更快的球。', '#ffd94a');
        }

        function update(dt) {
            const direction = (keys.has('ArrowRight') || keys.has('d') || keys.has('D') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('a') || keys.has('A') ? 1 : 0);
            if (direction) paddle.target = paddle.x + direction * 560 * dt;
            paddle.target = Math.max(left + paddle.w / 2, Math.min(right - paddle.w / 2, paddle.target));
            paddle.x += (paddle.target - paddle.x) * Math.min(1, dt * 18);
            if (state !== 'playing') { ball.x = paddle.x; ball.y = paddle.y - 24; return; }
            ball.trail.unshift({ x: ball.x, y: ball.y });
            if (ball.trail.length > 9) ball.trail.pop();
            ball.x += ball.vx * dt; ball.y += ball.vy * dt;
            if (ball.x - ball.r < left) { ball.x = left + ball.r; ball.vx = Math.abs(ball.vx); sound(280, .05); }
            if (ball.x + ball.r > right) { ball.x = right - ball.r; ball.vx = -Math.abs(ball.vx); sound(280, .05); }
            if (ball.y - ball.r < top) { ball.y = top + ball.r; ball.vy = Math.abs(ball.vy); sound(280, .05); }
            if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h && ball.x >= paddle.x - paddle.w / 2 - ball.r && ball.x <= paddle.x + paddle.w / 2 + ball.r) {
                const offset = (ball.x - paddle.x) / (paddle.w / 2);
                const speed = Math.min(590, Math.hypot(ball.vx, ball.vy) * 1.025);
                ball.vx = offset * speed * .82;
                ball.vy = -Math.sqrt(Math.max(1, speed * speed - ball.vx * ball.vx));
                ball.y = paddle.y - ball.r;
                sound(390 + Math.abs(offset) * 180, .075, 'triangle');
            }
            for (let index = bricks.length - 1; index >= 0; index--) {
                const brick = bricks[index];
                const nearestX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.w));
                const nearestY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.h));
                if ((ball.x - nearestX) ** 2 + (ball.y - nearestY) ** 2 > ball.r ** 2) continue;
                const overlapX = Math.min(ball.x + ball.r - brick.x, brick.x + brick.w - (ball.x - ball.r));
                const overlapY = Math.min(ball.y + ball.r - brick.y, brick.y + brick.h - (ball.y - ball.r));
                if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
                brick.hp--;
                if (brick.hp <= 0) {
                    bricks.splice(index, 1);
                    score += 10 * level;
                    burst(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color);
                    sound(250 + (index % 7) * 52, .13, 'sine', .055);
                    updateUI();
                } else {
                    sound(190, .08, 'square', .025);
                }
                break;
            }
            if (ball.y - ball.r > bottom) {
                lives--;
                burst(ball.x, bottom - 4, '#ff5798', 20);
                sound(110, .26, 'sawtooth', .06);
                updateUI();
                if (lives <= 0) {
                    state = 'over';
                    best = Math.max(best, score);
                    try { localStorage.setItem('prismBreakBest', String(best)); } catch (_) {}
                    updateUI();
                } else resetBall();
            }
            particles.forEach(particle => {
                particle.x += particle.vx * dt; particle.y += particle.vy * dt;
                particle.vx *= .985; particle.vy *= .985; particle.age += dt;
            });
            particles = particles.filter(particle => particle.age < particle.life);
            if (bricks.length === 0 && state === 'playing') { state = 'clear'; updateUI(); sound(740, .3, 'triangle', .06); }
        }

        function frame(now) {
            const dt = Math.min((now - lastTime) / 1000, .033);
            lastTime = now;
            update(dt);
            draw();
            raf = requestAnimationFrame(frame);
        }

        function moveToPointer(event) {
            const bounds = canvas.getBoundingClientRect();
            paddle.target = (event.clientX - bounds.left) * W / bounds.width;
        }

        ui.start.addEventListener('click', begin);
        ui.pause.addEventListener('click', () => {
            if (state === 'playing') state = 'paused';
            else if (state === 'paused') { state = 'playing'; lastTime = performance.now(); }
            updateUI();
        });
        ui.sound.addEventListener('click', () => {
            soundOn = !soundOn;
            ui.sound.textContent = `音效：${soundOn ? '開' : '關'}`;
            ui.sound.setAttribute('aria-pressed', String(soundOn));
            if (soundOn) sound(480, .08, 'triangle');
        });
        window.addEventListener('keydown', event => {
            if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
            keys.add(event.key);
            if (event.repeat) return;
            if (event.key === ' ' || event.key === 'Enter') {
                if (state === 'ready' || state === 'clear' || state === 'over') begin();
                else if (state === 'playing') { state = 'paused'; updateUI(); }
                else if (state === 'paused') { state = 'playing'; lastTime = performance.now(); updateUI(); }
            }
            if (event.key.toLowerCase() === 'p' && state === 'playing') { state = 'paused'; updateUI(); }
        });
        window.addEventListener('keyup', event => keys.delete(event.key));
        canvas.addEventListener('pointerdown', event => { canvas.setPointerCapture(event.pointerId); moveToPointer(event); });
        canvas.addEventListener('pointermove', event => { if (event.buttons || event.pointerType === 'touch') moveToPointer(event); });
        makeBricks(); updateUI(); lastTime = performance.now(); raf = requestAnimationFrame(frame);
        window.addEventListener('pagehide', () => cancelAnimationFrame(raf), { once: true });
    })();
    </script>
</body>
</html>
